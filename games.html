<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Games | Deep Blue Monkey</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #eaf4ff;
      background: linear-gradient(145deg, #071a33, #063b68 55%, #087e9b);
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(100%, 760px);
      padding: 40px 32px;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 24px;
      background: rgb(255 255 255 / 8%);
      box-shadow: 0 20px 60px rgb(0 0 0 / 25%);
      text-align: center;
    }

    h1 {
      font-size: clamp(2.2rem, 7vw, 3.5rem);
    }

    p {
      color: #c8e3f5;
      line-height: 1.7;
    }

    .game-list {
      display: grid;
      gap: 14px;
      margin-top: 28px;
    }

    .game-list a,
    .home-link {
      display: inline-block;
      padding: 14px 20px;
      border-radius: 999px;
      color: #06243d;
      background: #8ee8f2;
      font-weight: 700;
      text-decoration: none;
    }

    .game-list a:hover,
    .home-link:hover {
      background: #c0f6fb;
    }

    .home-link {
      margin-top: 28px;
    }
  </style>
</head>

<body>
  <main>
    <h1>My Games</h1>
    <p>Choose a game to play:</p>

    <div class="game-list">
     <a href="https://therippleeffect-mnq3j29vwrnh7b3vzjhctj.streamlit.app/">The Ripple Effect</a>
     <a href="https://detectivezinnyinindia-zcxbwfkqpfeqz4mdddfgqb.streamlit.app/">Detective Zinny</a>
     <a href="https://word-unscramble-game-jib3busctl4r69vhqjx2tq.streamlit.app/">Word Scramble</a>
     <a href="https://chemeveryday-dbt7gyrwx8dgfw8sdgndhe.streamlit.app/">Evevryday Chemistry</a>
    </div>

    <a class="home-link" href="index.html">Back to home</a>
  </main>
</body>
</html>
